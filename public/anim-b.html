<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>动图页 B · M9 事件流引擎</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; cursor: none; }
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--zoom, 1)); transform-origin: center center;
    background: radial-gradient(1200px 800px at 50% 30%, #0e1830 0%, #0a1122 45%, #070b16 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    color: #e8eef9; overflow: hidden;
  }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  #grid { position: absolute; inset: 0; opacity: .35;
    background-image: linear-gradient(rgba(129,140,248,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(129,140,248,.05) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(1000px 640px at 50% 50%, black 30%, transparent 78%);
  }
  #title {
    position: absolute; left: 50%; top: 74px; transform: translateX(-50%);
    font-size: 52px; font-weight: 800; letter-spacing: .04em; opacity: 0; white-space: nowrap;
  }
  #title em { font-style: normal; color: #818cf8; }
  #subtitle {
    position: absolute; left: 50%; top: 152px; transform: translateX(-50%);
    font-size: 23px; color: #8b9bc0; letter-spacing: .14em; opacity: 0; white-space: nowrap;
  }

  /* 主画布：算法层 → 播放器 → 视图层 */
  #canvas { position: absolute; left: 110px; right: 110px; top: 240px; bottom: 170px; }

  .box {
    position: absolute; border-radius: 20px;
    background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 30px 90px rgba(0,0,0,.5);
    opacity: 0;
  }
  .box .hd {
    padding: 16px 24px; font-size: 22px; font-weight: 700; color: #c9d4ef;
    border-bottom: 1px solid rgba(255,255,255,.07); display: flex; align-items: center; gap: 12px;
  }
  .box .hd .ic { width: 12px; height: 12px; border-radius: 3px; background: #818cf8; box-shadow: 0 0 16px rgba(129,140,248,.8); }

  #algos { left: 0; top: 60px; width: 420px; height: 620px; }
  #algos .list { padding: 18px 24px; display: flex; flex-direction: column; gap: 10px; }
  .algo {
    padding: 13px 20px; border-radius: 12px; font-size: 22px; color: #8b9bc0;
    border: 1px solid transparent; transition: all .4s;
  }
  .algo.on {
    color: #fff; border-color: rgba(129,140,248,.45); background: rgba(99,102,241,.14);
    box-shadow: 0 0 30px rgba(99,102,241,.25); transform: translateX(6px);
  }

  #player { left: 640px; top: 220px; width: 400px; height: 300px; }
  #player .bd { padding: 26px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
  .knobrow { display: flex; gap: 18px; }
  .pbtn {
    width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); font-size: 26px; color: #c9d4ef;
  }
  .pbtn.lit { border-color: rgba(129,140,248,.6); background: rgba(99,102,241,.2); box-shadow: 0 0 30px rgba(99,102,241,.4); color: #fff; }
  #speed { width: 100%; }
  #speed .lab { display: flex; justify-content: space-between; font-size: 18px; color: #8b9bc0; margin-bottom: 8px; }
  #speed .trk { height: 10px; border-radius: 5px; background: rgba(255,255,255,.08); position: relative; }
  #speed .hdl { position: absolute; top: 50%; left: 30%; width: 26px; height: 26px; border-radius: 50%; background: #818cf8; transform: translate(-50%,-50%); box-shadow: 0 0 18px rgba(129,140,248,.7); }

  .view {
    position: absolute; width: 300px; height: 200px; border-radius: 16px; overflow: hidden;
    background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.1); opacity: 0;
  }
  .view .vhd { padding: 10px 16px; font-size: 18px; color: #c9d4ef; border-bottom: 1px solid rgba(255,255,255,.07); font-weight: 700; }
  .view .vbd { height: 148px; position: relative; }
  .view.lit { border-color: rgba(129,140,248,.5); box-shadow: 0 0 40px rgba(99,102,241,.3); }
  #v-array { right: 0; top: 0; }
  #v-list  { right: 0; top: 215px; }
  #v-tree  { right: 0; top: 430px; }
  #v-heap  { right: 0; top: 645px; height: 175px; }

  /* 视图内部微图形 */
  .bars { position: absolute; inset: 16px; display: flex; align-items: flex-end; gap: 8px; }
  .bars i { flex: 1; background: #3b4a75; border-radius: 4px 4px 0 0; transition: background .3s; }
  .bars i.cmp { background: #fbbf24; }
  .bars i.swp { background: #818cf8; }
  .nodes { position: absolute; inset: 0; }
  .nnode { position: absolute; width: 52px; height: 34px; border: 2px solid #5b6b8f; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #c9d4ef; transition: all .3s; }
  .nnode.hot { border-color: #fbbf24; color: #fde68a; box-shadow: 0 0 18px rgba(251,191,36,.35); }
  .nline { position: absolute; height: 2px; background: #5b6b8f; transform-origin: left center; }
  .tnode { position: absolute; width: 40px; height: 40px; border-radius: 50%; border: 2px solid #5b6b8f; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #c9d4ef; background: #0c1322; transition: all .3s; }
  .tnode.hot { border-color: #34d399; color: #a7f3d0; box-shadow: 0 0 18px rgba(52,211,153,.35); }

  /* 事件方块流 */
  .ev {
    position: absolute; top: 370px; left: 430px; padding: 8px 16px; border-radius: 8px;
    font-size: 17px; font-family: ui-monospace, Consolas, monospace; white-space: nowrap;
    background: rgba(99,102,241,.18); border: 1px solid rgba(129,140,248,.55); color: #c7d2fe;
    box-shadow: 0 0 18px rgba(99,102,241,.35); z-index: 5;
  }
  .ev.warn { background: rgba(251,191,36,.14); border-color: rgba(251,191,36,.55); color: #fde68a; }

  /* 连接线（流动虚线） */
  #wires { position: absolute; inset: 0; pointer-events: none; }
  #wires path { fill: none; stroke: rgba(129,140,248,.4); stroke-width: 2; stroke-dasharray: 6 10; opacity: 0; }
  #wires path.flow { opacity: 1; animation: dashmove 1s linear infinite; }
  @keyframes dashmove { to { stroke-dashoffset: -16; } }

  #stack {
    position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%);
    font-size: 24px; color: #8b9bc0; letter-spacing: .08em; opacity: 0; white-space: nowrap;
  }
  #stack b { color: #c9d4ef; font-weight: 700; }
  #stack .sep { margin: 0 18px; color: #3d4a6b; }

  #hud { position: absolute; right: 34px; bottom: 26px; font-size: 16px; color: #54628a; letter-spacing: .1em; z-index: 99; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="title">一套事件流引擎，驱动全部 <em>22 个算法</em></div>
  <div id="subtitle">演示的正确性由引擎保证，而不是由美术保证</div>

  <div id="canvas">
    <svg id="wires" viewBox="0 0 1700 830" width="100%" height="100%">
      <path id="w0" d="M 420 370 L 640 370"/>
      <path id="w1" d="M 1040 370 C 1200 370 1200 100 1400 100"/>
      <path id="w2" d="M 1040 370 C 1200 370 1200 315 1400 315"/>
      <path id="w3" d="M 1040 370 C 1200 370 1200 530 1400 530"/>
      <path id="w4" d="M 1040 370 C 1200 370 1200 745 1400 745"/>
    </svg>

    <div class="box" id="algos">
      <div class="hd"><span class="ic"></span>算法层 · 事件生成器</div>
      <div class="list">
        <div class="algo">单链表按位插入</div>
        <div class="algo">栈 · 括号匹配</div>
        <div class="algo">二叉树遍历</div>
        <div class="algo">堆的调整</div>
        <div class="algo">快速排序</div>
        <div class="algo">Dijkstra 最短路</div>
        <div class="algo" style="color:#54628a">… 共 22 个</div>
      </div>
    </div>

    <div class="box" id="player">
      <div class="hd"><span class="ic" style="background:#fbbf24;box-shadow:0 0 16px rgba(251,191,36,.8)"></span>播放器 · 统一调度</div>
      <div class="bd">
        <div class="knobrow">
          <div class="pbtn" id="pb-play">▶</div>
          <div class="pbtn" id="pb-pause">⏸</div>
          <div class="pbtn" id="pb-step">⏭</div>
        </div>
        <div id="speed">
          <div class="lab"><span>0.5×</span><span>速度</span><span>2×</span></div>
          <div class="trk"><div class="hdl" id="speed-hdl"></div></div>
        </div>
      </div>
    </div>

    <div class="view" id="v-array"><div class="vhd">数组视图</div><div class="vbd"><div class="bars" id="bars"></div></div></div>
    <div class="view" id="v-list"><div class="vhd">链表视图</div><div class="vbd"><div class="nodes" id="listview"></div></div></div>
    <div class="view" id="v-tree"><div class="vhd">树 / 堆视图</div><div class="vbd"><div class="nodes" id="treeview"></div></div></div>
    <div class="view" id="v-heap"><div class="vhd">图视图</div><div class="vbd"><div class="nodes" id="graphview"></div></div></div>
  </div>

  <div id="stack"><b>React 19</b><span class="sep">·</span><b>TypeScript</b><span class="sep">·</span><b>DeepSeek API</b><span class="sep">·</span><b>Vercel</b></div>
  <div id="hud">READY · 按 1 播放 · R 重播 · H 隐藏提示</div>
</div>

<script>
function fit(){ const z = Math.min(innerWidth/1920, innerHeight/1080); document.getElementById('stage').style.setProperty('--zoom', z); }
fit(); addEventListener('resize', fit);

const wait = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);
const css = (el, p) => Object.assign(el.style, p);
function tween({dur=600, ease=t=>1-Math.pow(1-t,3), step}) {
  return new Promise(res => { const t0 = performance.now();
    (function f(){ const t = Math.min(1,(performance.now()-t0)/dur); step(ease(t)); if(t<1) setTimeout(f,16); else res(); })(); });
}

/* 视图微图形初始化 */
function buildViews() {
  const bars = $('bars');
  bars.innerHTML = '';
  const hs = [38, 65, 30, 80, 55, 92, 44, 70];
  hs.forEach(h => { const i = document.createElement('i'); i.style.height = h + '%'; bars.appendChild(i); });

  const lv = $('listview'); lv.innerHTML = '';
  const xs = [26, 106, 186, 266];
  xs.forEach((x, i) => {
    const n = document.createElement('div'); n.className = 'nnode'; n.textContent = ['a₁','a₂','a₃','s'][i];
    css(n, { left: (x * 0.92) + 'px', top: '58px' }); lv.appendChild(n);
    if (i < 3) { const l = document.createElement('div'); l.className = 'nline'; css(l, { left: (x * 0.92 + 52) + 'px', top: '74px', width: '22px' }); lv.appendChild(l); }
  });

  const tv = $('treeview'); tv.innerHTML = '';
  const tn = [[120, 14], [70, 70], [170, 70], [45, 124], [95, 124], [145, 124], [195, 124]];
  tn.forEach(([x, y], i) => { const n = document.createElement('div'); n.className = 'tnode'; n.textContent = i + 1; css(n, { left: x + 'px', top: y + 'px' }); tv.appendChild(n); });

  const gv = $('graphview'); gv.innerHTML = '';
  const gn = [[40, 30], [130, 16], [215, 40], [80, 92], [180, 104], [245, 108]];
  gn.forEach(([x, y], i) => { const n = document.createElement('div'); n.className = 'tnode'; n.textContent = String.fromCharCode(65 + i); css(n, { left: x + 'px', top: y + 'px' }); gv.appendChild(n); });
}

const EV_DEFS = [
  { t: 'compare(a[i], a[j])', w: false }, { t: 'swap(a[i], a[j])', w: true },
  { t: 'move(p, p->next)', w: false }, { t: 'visit(node)', w: false },
  { t: 'alloc(s)', w: true }, { t: 'relax(u, v)', w: false },
  { t: 'push(stack, x)', w: true }, { t: 'link(p, s)', w: true },
];

let running = false;
async function run() {
  if (running) return; running = true;
  $('hud').textContent = 'M9 播放中…';
  buildViews();

  /* 重置 */
  ['algos', 'player', 'v-array', 'v-list', 'v-tree', 'v-heap', 'title', 'subtitle', 'stack'].forEach(id => css($(id), { opacity: 0 }));
  document.querySelectorAll('#wires path').forEach(p => p.classList.remove('flow'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('lit'));
  document.querySelectorAll('.algo').forEach(a => a.classList.remove('on'));
  document.querySelectorAll('.pbtn').forEach(b => b.classList.remove('lit'));

  /* 0-3s 标题 */
  await tween({ dur: 800, step: v => css($('title'), { opacity: v, top: 84 - 10 * v + 'px' }) });
  tween({ dur: 800, step: v => css($('subtitle'), { opacity: v }) });
  await wait(1400);

  /* 3-8s 算法层入场 + 逐个亮起 */
  tween({ dur: 700, step: v => css($('algos'), { opacity: v, transform: `translateX(${40 * (1 - v)}px)` }) });
  await wait(600);
  const algos = document.querySelectorAll('.algo');
  for (let i = 0; i < algos.length - 1; i++) { algos[i].classList.add('on'); await wait(420); algos[i].classList.remove('on'); }
  algos[4].classList.add('on'); // 停在快速排序
  await wait(400);

  /* 播放器入场 */
  tween({ dur: 700, step: v => css($('player'), { opacity: v, transform: `scale(${.92 + .08 * v})` }) });
  $('w0').classList.add('flow');
  $('pb-play').classList.add('lit');
  await wait(600);

  /* 事件流：从算法层流向播放器 */
  const canvas = $('canvas');
  let evIdx = 0, streaming = true;
  const views = [['v-array', 'w1'], ['v-list', 'w2'], ['v-tree', 'w3'], ['v-heap', 'w4']];
  let viewPtr = 0;

  async function spawnEv() {
    const d = EV_DEFS[evIdx++ % EV_DEFS.length];
    const el = document.createElement('div');
    el.className = 'ev' + (d.w ? ' warn' : '');
    el.textContent = d.t;
    canvas.appendChild(el);
    await tween({ dur: 1500, ease: t => t, step: v => css(el, { left: 430 + 180 * v + 'px', opacity: Math.min(1, v * 4) }) });
    el.remove();
    // 到达播放器：随机亮一个视图
    const [vid, wid] = views[viewPtr++ % views.length];
    const view = $(vid);
    if (!view.classList.contains('lit')) {
      $(wid).classList.add('flow');
      tween({ dur: 500, step: v => css(view, { opacity: v, transform: `translateX(${30 * (1 - v)}px)` }) });
      view.classList.add('lit');
    }
    pulseView(vid);
  }
  function pulseView(vid) {
    const v = $(vid);
    if (vid === 'v-array') {
      const bars = v.querySelectorAll('.bars i');
      const a = Math.floor(Math.random() * 8), b = Math.floor(Math.random() * 8);
      bars[a].className = 'cmp'; bars[b].className = 'swp';
      setTimeout(() => { bars[a].className = ''; bars[b].className = ''; }, 700);
    } else {
      const ns = v.querySelectorAll('.nnode,.tnode');
      const n = ns[Math.floor(Math.random() * ns.length)];
      n.classList.add('hot'); setTimeout(() => n.classList.remove('hot'), 700);
    }
  }

  /* 8-16s 事件流 */
  const tEnd = performance.now() + 8000;
  while (performance.now() < tEnd) { spawnEv(); await wait(750); }
  $('pb-play').classList.remove('lit'); $('pb-step').classList.add('lit');

  /* 16-20s 单步演示：慢放两个事件 */
  await wait(500);
  for (let i = 0; i < 2; i++) { await spawnEv(); await wait(900); }
  $('pb-step').classList.remove('lit');
  // 速度旋钮滑动
  await tween({ dur: 900, step: v => css($('speed-hdl'), { left: 30 + 40 * v + '%' }) });
  $('pb-play').classList.add('lit');
  for (let i = 0; i < 3; i++) { spawnEv(); await wait(400); }

  /* 20-24s 全部视图点亮 + 技术栈 */
  views.forEach(([vid, wid]) => {
    if (!$(vid).classList.contains('lit')) {
      $(wid).classList.add('flow');
      tween({ dur: 500, step: v => css($(vid), { opacity: v }) });
      $(vid).classList.add('lit');
    }
  });
  await tween({ dur: 800, step: v => css($('stack'), { opacity: v, bottom: 56 + 8 * (1 - v) + 'px' }) });
  await wait(2600);
  $('pb-play').classList.remove('lit');

  /* 定格收尾 */
  await wait(800);
  $('hud').textContent = 'M9 结束 · 按 R 重播';
  running = false;
}

addEventListener('keydown', e => {
  if (e.key === '1' || e.key === ' ') { e.preventDefault(); run(); }
  else if (e.key.toLowerCase() === 'r') run();
  else if (e.key.toLowerCase() === 'h') { const h = $('hud'); h.style.display = h.style.display === 'none' ? '' : 'none'; }
});
</script>
</body>
</html>
